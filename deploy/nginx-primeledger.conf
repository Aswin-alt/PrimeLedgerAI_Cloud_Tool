# Nginx site for https://tool.primeledgerai.com
# Install:
#   sudo cp deploy/nginx-primeledger.conf /etc/nginx/sites-available/primeledger
#   sudo ln -sf /etc/nginx/sites-available/primeledger /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then obtain TLS with:
#   sudo certbot --nginx -d tool.primeledgerai.com

server {
    listen 80;
    listen [::]:80;
    server_name tool.primeledgerai.com;

    # Allow PDF / CSV / XLSX uploads used by converters
    client_max_body_size 50M;

    location /static/ {
        alias /opt/primeledger/webapp/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
